<div class="footer-inner">
  <p class="footer-line">
    <span class="prompt-symbol">$</span>
    <span class="prompt-cmd">powered by Jekyll &amp; GitHub Pages</span>
  </p>
  <p class="footer-line">
    <span class="prompt-symbol">$</span>
    <span class="prompt-cmd">echo "&copy; {{ 'now' | date: '%Y' }} {{ site.author.name | default: site.title }}. All rights reserved."</span>
  </p>
  <p class="footer-output">=> 用 <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a> 构建 · 托管于 <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a></p>
  <div class="footer-social">
    {% if site.author.github %}
    <a class="social-link" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
    {% endif %}
    {% if site.author.email %}
    <a class="social-link" href="mailto:{{ site.author.email }}">Email</a>
    {% endif %}
    <a class="social-link" href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
</div>
