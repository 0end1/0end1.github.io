<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="登录交互时序图示意">
  <defs>
    <marker id="sa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#0d1117"/>
  <text x="24" y="34" fill="#3fb950" font-size="16" font-weight="700">交互时序图 · 用户登录 (sequence-login.svg)</text>

  <!-- 参与者 -->
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="80" y="50" width="120" height="36" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="140" y="73" fill="#58a6ff">用户</text>
    <rect x="300" y="50" width="120" height="36" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="360" y="73" fill="#3fb950">前端</text>
    <rect x="520" y="50" width="120" height="36" rx="8" fill="#161b22" stroke="#bc8cff"/>
    <text x="580" y="73" fill="#bc8cff">后端 API</text>
  </g>
  <!-- 生命线 -->
  <g stroke="#30363d" stroke-dasharray="4 4">
    <line x1="140" y1="86" x2="140" y2="320"/>
    <line x1="360" y1="86" x2="360" y2="320"/>
    <line x1="580" y1="86" x2="580" y2="320"/>
  </g>
  <!-- 消息 -->
  <g font-size="11" fill="#8b949e">
    <line x1="140" y1="110" x2="360" y2="110" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="150" y="104">① 点击登录</text>
    <line x1="360" y1="150" x2="580" y2="150" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="370" y="144">② POST /login</text>
    <line x1="580" y1="190" x2="360" y2="190" stroke="#3fb950" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="430" y="184">③ 200 + token</text>
    <line x1="360" y1="230" x2="360" y2="270" stroke="#d29922" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="372" y="252">④ 存储 token</text>
    <line x1="360" y1="300" x2="140" y2="300" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#sa)"/>
    <text x="200" y="294">⑤ 跳转首页</text>
  </g>
</svg>
