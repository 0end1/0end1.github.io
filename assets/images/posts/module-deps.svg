<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="模块依赖关系图示意">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="bad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#0d1117"/>
  <text x="24" y="34" fill="#3fb950" font-size="16" font-weight="700">模块依赖图 (module-deps.svg)</text>
  <text x="24" y="56" fill="#8b949e" font-size="12">扫描内部 import，控制节点数，揪出循环依赖</text>

  <!-- 节点 -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <!-- A -->
    <rect x="80" y="150" width="120" height="56" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="140" y="184" fill="#58a6ff">user</text>
    <!-- B -->
    <rect x="300" y="150" width="120" height="56" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="360" y="184" fill="#3fb950">order</text>
    <!-- C -->
    <rect x="300" y="280" width="120" height="56" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="360" y="314" fill="#d29922">payment</text>
    <!-- D -->
    <rect x="520" y="215" width="120" height="56" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="580" y="249" fill="#bc8cff">api</text>
  </g>

  <!-- 正常依赖 -->
  <line x1="200" y1="178" x2="300" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="360" y1="206" x2="360" y2="280" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="420" y1="178" x2="520" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="420" y1="308" x2="520" y2="258" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- 循环依赖（红） -->
  <path d="M140,206 C140,300 300,330 300,236" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#bad)"/>
  <text x="200" y="330" fill="#f85149" font-size="12">⚠ 循环依赖: user → order → user</text>
</svg>
