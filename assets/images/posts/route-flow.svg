<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="页面路由流转图示意">
  <defs>
    <marker id="rf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#0d1117"/>
  <text x="24" y="34" fill="#3fb950" font-size="16" font-weight="700">页面路由流转图 (route-flow.svg)</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="60" y="60" width="140" height="50" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="130" y="91" fill="#58a6ff">/login</text>
    <rect x="290" y="60" width="140" height="50" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="360" y="91" fill="#3fb950">/dashboard</text>
    <rect x="290" y="160" width="140" height="50" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="360" y="191" fill="#bc8cff">/profile</text>
    <rect x="520" y="160" width="140" height="50" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="590" y="191" fill="#f85149">/404</text>
  </g>

  <g font-size="11" fill="#8b949e">
    <line x1="200" y1="85" x2="290" y2="85" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#rf)"/>
    <text x="210" y="78">登录成功</text>
    <line x1="360" y1="110" x2="360" y2="160" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#rf)"/>
    <text x="368" y="140">导航</text>
    <!-- 未登录守卫 -->
    <path d="M360,85 C360,40 520,40 590,160" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#rf)"/>
    <text x="430" y="55" fill="#f85149">未登录 → 重定向</text>
  </g>
</svg>
