<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="登录表单状态机图示意">
  <defs>
    <marker id="st" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0d1117"/>
  <text x="24" y="34" fill="#3fb950" font-size="16" font-weight="700">状态机图 · 登录表单 (state-login.svg)</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40" y="130" width="120" height="54" rx="27" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="163" fill="#58a6ff">idle</text>
    <rect x="230" y="130" width="120" height="54" rx="27" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="290" y="163" fill="#d29922">loading</text>
    <rect x="430" y="80" width="120" height="54" rx="27" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="490" y="113" fill="#3fb950">success</text>
    <rect x="430" y="190" width="120" height="54" rx="27" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="490" y="223" fill="#f85149">error</text>
  </g>

  <g font-size="11" fill="#8b949e">
    <line x1="160" y1="157" x2="230" y2="157" stroke="#8b949e" stroke-width="1.5" marker-end="url(#st)"/>
    <text x="168" y="150">submit</text>
    <line x1="350" y1="145" x2="430" y2="118" stroke="#8b949e" stroke-width="1.5" marker-end="url(#st)"/>
    <text x="370" y="128">resolve</text>
    <line x1="350" y1="172" x2="430" y2="200" stroke="#8b949e" stroke-width="1.5" marker-end="url(#st)"/>
    <text x="370" y="195">reject</text>
    <line x1="490" y1="190" x2="490" y2="134" stroke="#8b949e" stroke-width="1.5" marker-end="url(#st)"/>
    <text x="498" y="165">重试</text>
  </g>
</svg>
