<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="权限路由守卫决策树示意">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#0d1117"/>
  <text x="24" y="34" fill="#3fb950" font-size="16" font-weight="700">权限路由守卫图 (auth-guard.svg)</text>

  <!-- 决策节点 -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <polygon points="160,90 220,60 280,90 220,120" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="220" y="94" fill="#d29922" font-size="12">有 token?</text>
    <polygon points="160,210 220,180 280,210 220,240" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="220" y="214" fill="#d29922" font-size="12">角色 admin?</text>
    <rect x="420" y="50" width="130" height="44" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="485" y="78" fill="#3fb950">放行</text>
    <rect x="420" y="190" width="130" height="44" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="485" y="218" fill="#f85149">403 无权限</text>
    <rect x="60" y="300" width="160" height="44" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="140" y="328" fill="#58a6ff">重定向 /login</text>
  </g>

  <g font-size="11" fill="#8b949e">
    <line x1="220" y1="120" x2="220" y2="180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="228" y="155">是</text>
    <line x1="280" y1="210" x2="420" y2="72" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="320" y="120">是</text>
    <line x1="280" y1="210" x2="420" y2="212" stroke="#f85149" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="320" y="215">否</text>
    <line x1="160" y1="90" x2="140" y2="300" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="120" y="200">否</text>
  </g>
</svg>
