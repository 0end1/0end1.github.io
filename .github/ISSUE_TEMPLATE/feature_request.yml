name: "✨ 功能建议"
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "感谢你的建议！请描述清楚你的想法。"
  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题？
      description: 描述当前体验的不足或缺失
      placeholder: "例如：文章页缺少上一篇/下一篇的快捷跳转…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 描述你希望实现的功能或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案（可选）
      description: 是否有其他实现思路
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充说明（可选）
      description: 截图、参考站点链接等
    validations:
      required: false
