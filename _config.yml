# =============================================================
# 个人博客配置 —— 修改这里即可定制你的站点
# =============================================================

# ---------- 站点基本信息 ----------
title: DevLog                     # 站点名称
description: >-                   # 站点描述（用于 SEO / 搜索）
  一个程序员风格的个人博客，记录技术、代码与生活。
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: Wang Zhiyong              # 你的名字
  email: yourname@example.com     # 你的邮箱
  github: 0end1                   # GitHub 用户名
  avatar: /assets/images/avatar.svg  # 头像路径（可换成自己的图）

# ---------- 站点地址（重要！） ----------
# 用户名站点:  https://<你的用户名>.github.io  且 baseurl 留空
# 项目站点:    https://<你的用户名>.github.io/<仓库名>  且 baseurl 填 "/<仓库名>"
url: "https://0end1.github.io"
baseurl: ""

# ---------- 分页 ----------
paginate: 8
paginate_path: "/page:num"

# ---------- 打赏 / 赞助 ----------
sponsor:
  enabled: true                    # 设为 false 关闭打赏区
  text: "如果这篇文章对你有帮助，欢迎扫码打赏支持作者，你的支持是持续创作的最大动力。"
  qrcode: "/assets/images/sponsor-qrcode.svg"   # 打赏二维码图片（换成自己的收款码）

# ---------- 评论系统 (giscus) ----------
# 使用方法：
#   1. 在 GitHub 仓库开启 Discussions 功能
#   2. 访问 https://github.com/apps/giscus 安装并配置
#   3. 在 https://giscus.app 生成 repo_id / category_id 填入下面
giscus:
  enabled: false                  # 设为 true 开启评论
  repo: "0end1/0end1.github.io"   # 你的 GitHub 仓库
  repo_id: ""                     # 从 giscus.app 获取
  category: "Announcements"       # Discussions 分类
  category_id: ""                 # 从 giscus.app 获取
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "top"
  lang: "zh-CN"

# ---------- 构建插件（GitHub Pages 官方支持列表） ----------
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: true

# ---------- 默认 Front Matter ----------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true               # 每篇文章默认开启评论

# ---------- 其他 ----------
permalink: /:year/:month/:day/:title/
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - LICENSE
  - .gitignore
  - .editorconfig
  - .github
  - .DS_Store
